name: Deploy Production

on:
  workflow_run:
    workflows: ["tests"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      ####################################################
      # Backend
      ####################################################

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          file: ./deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/niloferbano/family-inventory:${{ github.event.workflow_run.head_sha }}

      ####################################################
      # Frontend
      ####################################################

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/frontend.Dockerfile
          push: true
          tags: |
            ghcr.io/niloferbano/family-inventory-web:${{ github.event.workflow_run.head_sha }}

      ####################################################
      # SSH
      ####################################################

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CONTABO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Transfer and deploy tested release
        env:
          DEPLOY_HOST: ${{ secrets.CONTABO_HOST }}
          DEPLOY_USER: ${{ secrets.CONTABO_USER }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          git archive --format=tar HEAD deploy | gzip > release.tar.gz
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p /home/nilofer/family-inventory/releases/$RELEASE_SHA"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes release.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:/home/nilofer/family-inventory/releases/$RELEASE_SHA/release.tar.gz"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /home/nilofer/family-inventory/releases/$RELEASE_SHA && tar -xzf release.tar.gz && bash deploy/release.sh $RELEASE_SHA"

      - name: Remove runner SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519
