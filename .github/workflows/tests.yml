name: tests

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: family_test
          POSTGRES_PASSWORD: family_pass
          POSTGRES_DB: family_test
          REQUIRE_TEST_DATABASE: "true"
        options: >-
          --health-cmd "pg_isready -U family_test -d family_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://family_test:family_pass@127.0.0.1:5432/family_test
      CACHE__HOST: 127.0.0.1
      DEBUG: "false"
      REQUIRE_TEST_DATABASE: "true"

      JWT_SECRET_KEY: test-secret
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      ACTIVATION_TOKEN_EXPIRE_MINUTES: "30"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Poetry
        run: pip install poetry==2.3.2

      - name: Install dependencies
        run: poetry install --no-root

      - name: Install coverage
        run: poetry run pip install coverage==7.16.0

      - name: Run tests with branch coverage
        run: poetry run coverage run -m pytest -q

      - name: Generate coverage reports
        if: always()
        run: |
          poetry run coverage report
          poetry run coverage xml
          poetry run coverage html

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
