name: family-inventory

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  postgres:
    image: postgres:16.10
    restart: unless-stopped
    networks: [backend]
    logging: *logging
    env_file:
      - ../.env.docker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbitmq
    restart: unless-stopped
    networks: [backend]
    logging: *logging
    env_file:
      - ../.env.docker
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    networks: [backend]
    logging: *logging
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
  rabbitmqdata:
  redisdata:
networks:
  backend:
    driver: bridge
