name: family-inventory-test
services:
  postgres-test:
    image: postgres:16
    env_file:
      - ../.env.docker.test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U family_test -d family_test]
      interval: 2s
      timeout: 3s
      retries: 30
  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  test:
    environment:
      TEST_REDIS_URL: redis://redis-test:6379/0
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: test
    env_file:
      - ../.env.docker.test
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
